services:
  # ── FastAPI RAG ──────────────────────────────────────────────
  fastapi:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: aira-rag
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OLLAMA_HOST=http://host.docker.internal:11434 # Ollama en Windows/host via Docker Desktop
      - OLLAMA_CHAT_MODEL=${OLLAMA_CHAT_MODEL:-llama3.2:3b}
      - VAULT_PATH=/vault
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
    volumes:
      - ${VAULT_PATH}:/vault # Obsidian vault
      - chroma_data:/app/chroma # Vector DB
      - pdf_inbox:/app/data/documents # PDFs
      - hf_cache:/root/.cache/huggingface # Cache embeddings
      - /var/run/docker.sock:/var/run/docker.sock
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - aira-net

  # ── OpenClaw gateway (agent + Telegram) ─────────────────────
  openclaw-gateway:
    image: ghcr.io/openclaw/openclaw:latest
    container_name: aira-openclaw
    user: root
    restart: unless-stopped
    ports:
      - "18789:18789"
    environment:
      - OLLAMA_API_KEY=ollama-local
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - AGENT_MODEL=${AGENT_MODEL:-anthropic/claude-haiku-4-5}
    volumes:
      - ${VAULT_PATH}:/vault
      - ./config/openclaw.json:/tmp/openclaw.json
      - ./config/skills:/tmp/skills
      - ./config/agent:/tmp/agent
      - ./config/workspace:/tmp/workspace
      - openclaw_config:/root/.openclaw
    entrypoint: >
      /bin/sh -c "
      mkdir -p /root/.openclaw/agents/main/agent &&
      mkdir -p /root/.openclaw/workspace &&
      rm -rf /root/.openclaw/skills && mkdir -p /root/.openclaw/skills &&
      sed \"s|\${TELEGRAM_BOT_TOKEN}|${TELEGRAM_BOT_TOKEN}|g; s|\${AGENT_MODEL}|${AGENT_MODEL}|g\" /tmp/openclaw.json > /root/.openclaw/openclaw.json &&
      cp -r /tmp/skills/. /root/.openclaw/skills/ &&
      cp -r /tmp/workspace/. /root/.openclaw/workspace/ &&
      sed \"s|\${ANTHROPIC_API_KEY}|${ANTHROPIC_API_KEY}|g\" /tmp/agent/auth-profiles.json > /root/.openclaw/agents/main/agent/auth-profiles.json &&
      echo '=== Vault check ===' &&
      ls /vault > /dev/null 2>&1 && echo 'Vault OK' || echo 'WARNING: /vault no accesible' &&
      exec node dist/index.js gateway
      "
    depends_on:
      fastapi:
        condition: service_healthy
    networks:
      - aira-net

  # ── OpenClaw CLI (for manual commands) ────────────────────
  openclaw-cli:
    image: ghcr.io/openclaw/openclaw:latest
    container_name: aira-openclaw-cli
    profiles: ["cli"]
    volumes:
      - ./config/openclaw.json:/home/node/.openclaw/openclaw.json
      - ./config/skills:/home/node/.openclaw/skills
      - openclaw_config:/home/node/.openclaw
    networks:
      - aira-net
    entrypoint: ["node", "dist/index.js"]

  searxng:
    image: searxng/searxng:latest
    container_name: aira-searxng
    restart: unless-stopped
    volumes:
      - ./config/searxng:/etc/searxng:rw
    networks:
      - aira-net

# ── Volumes ──────────────────────────────────────────────────
volumes:
  chroma_data:
  pdf_inbox:
  hf_cache:
  openclaw_config:

# ── Internal nerwork ────────────────────────────────────────────────
networks:
  aira-net:
    driver: bridge
