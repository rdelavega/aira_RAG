services:
  # ── FastAPI RAG ──────────────────────────────────────────────
  fastapi:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: aira-rag
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OLLAMA_HOST=http://host.docker.internal:11434 # Ollama en Windows/host via Docker Desktop
      - OLLAMA_CHAT_MODEL=${OLLAMA_CHAT_MODEL:-llama3.2:3b}
      - VAULT_PATH=/vault
    volumes:
      - ${VAULT_PATH}:/vault # Obsidian vault
      - chroma_data:/app/chroma # Vector DB
      - pdf_inbox:/app/data/documents # PDFs
      - hf_cache:/root/.cache/huggingface # Cache embeddings
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - aira-net

  # ── Aira bot (Telegram + Claude API directo) ────────────────
  aira-bot:
    build:
      context: backend/bot
    container_name: aira-bot
    restart: unless-stopped
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - AGENT_MODEL=${AGENT_MODEL:-claude-haiku-4-5}
      - MAX_HISTORY_TURNS=${MAX_HISTORY_TURNS:-5}
      - RAG_URL=http://fastapi:8000
      - SEARXNG_URL=http://searxng:8080
      - VAULT_PATH=/vault
    volumes:
      - ${VAULT_PATH}:/vault
    depends_on:
      fastapi:
        condition: service_healthy
    networks:
      - aira-net

  searxng:
    image: searxng/searxng:latest
    container_name: aira-searxng
    restart: unless-stopped
    volumes:
      - ./config/searxng:/etc/searxng:rw
    networks:
      - aira-net

# ── Volumes ──────────────────────────────────────────────────
volumes:
  chroma_data:
  pdf_inbox:
  hf_cache:

# ── Internal nerwork ────────────────────────────────────────────────
networks:
  aira-net:
    driver: bridge
